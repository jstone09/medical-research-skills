name: Link Check
on:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 pinned
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0 pinned
        with:
          args: >
            --verbose
            --no-progress
            --max-concurrency 10
            --retry-wait-time 2
            --format detailed
            --exclude-path "**/node_modules/**"
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
