name: Generate skill manifest
on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - 'scripts/generate_skill_manifest.py'
  push:
    branches: [ main ]
    paths:
      - '**/SKILL.md'
      - 'scripts/generate_skill_manifest.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 pinned
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 pinned
        with:
          python-version: '3.10'
      - name: Generate manifest
        run: python scripts/generate_skill_manifest.py
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 pinned
        with:
          name: skill-manifest
          path: dist/skill-manifest.json
